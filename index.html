<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race to Riches – English Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mall" id="mall"></div>
<div id="coins"></div>

<!-- HOME -->
<section id="home" class="screen active">
  <h1 class="title">RACE TO RICHES</h1>
  <div class="sub">ENGLISH CAMP</div>
  <button class="btn start" id="btnStart">START GAME</button>
  <div class="row">
    <button class="btn" id="btnHomeScore">SCOREBOARD</button>
    <button class="btn" id="btnHomeSettings">SETTINGS</button>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings" class="screen">
  <div class="panel">
    <h2>Settings</h2>
    <div class="grid2">
      <label>Team 1 <input id="sName0"></label><label>Team 2 <input id="sName1"></label>
      <label>Team 3 <input id="sName2"></label><label>Team 4 <input id="sName3"></label>
      <label>Question preview (seconds) <input id="sPre" type="number" min="3" max="120"></label>
      <label>Answering time (seconds) <input id="sAns" type="number" min="5" max="300"></label>
      <label>Answering music (MP3) <input id="sMusic" type="file" accept="audio/*"></label>
      <label>Music volume <input id="sVol" type="range" min="0" max="1" step="0.05"></label>
      <label><input id="sMute" type="checkbox"> Mute music</label>
      <label><input id="sFs" type="checkbox"> Go full-screen when game starts</label>
      <label>Homepage background image <input id="sBg" type="file" accept="image/*"></label>
      <label>&nbsp;<button class="btn small" id="btnBgClear">Remove uploaded background</button></label>
    </div>
    <div class="row">
      <button class="btn small" id="btnMusicTest">Preview music</button>
      <button class="btn small" id="btnMusicStop">Stop preview</button>
      <button class="btn small" id="btnSave">SAVE SETTINGS</button>
      <button class="btn small" id="btnSettingsHome">RETURN TO HOME</button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div id="timer">10</div>
  <div id="qnum">QUESTION 1 / 20</div>
  <div id="qbox"></div>
  <div id="answers">
    <div class="ans blue" data-c="blue"><span class="sym">▲</span><span class="atext"></span></div>
    <div class="ans yellow" data-c="yellow"><span class="sym">◆</span><span class="atext"></span></div>
    <div class="ans green" data-c="green"><span class="sym">●</span><span class="atext"></span></div>
    <div class="ans red" data-c="red"><span class="sym">■</span><span class="atext"></span></div>
  </div>
  <div id="banner">CORRECT ANSWER!</div>
  <div id="scorepanel"></div>
</section>

<!-- SCOREBOARD -->
<section id="score" class="screen">
  <div class="panel wide">
    <h2>Golden Scoreboard</h2>
    <div id="rank"></div>
    <div class="tablewrap"><table id="hist"></table></div>
    <div class="row adj" id="adjust"></div>
    <div class="row">
      <button class="btn small" id="btnScoreBack">RETURN</button>
    </div>
  </div>
</section>

<!-- PODIUM -->
<section id="podium" class="screen">
  <canvas id="fx"></canvas>
  <h2 id="pTitle">Choose 3rd place</h2>
  <div id="pChoices" class="row"></div>
  <div id="stage"></div>
  <div class="row pbtn">
    <button class="btn small" id="btnPReplay">REPLAY</button>
    <button class="btn small" id="btnPMode">SWITCH TO MANUAL PICK</button>
    <button class="btn small" id="btnPUndo">UNDO SELECTION</button>
    <button class="btn small" id="btnPRestart">RESTART GAME</button>
    <button class="btn small" id="btnPHome">RETURN TO MAIN MENU</button>
  </div>
</section>

<!-- TEACHER BAR -->
<div id="bar">
  <button id="bPrev">◀ PREVIOUS</button>
  <button id="bSkip">SKIP TO ANSWER REVEAL</button>
  <button id="bFs">FULL-SCREEN</button>
  <button id="bHome">HOME</button>
  <button id="bEnd">END GAME → PODIUM</button>
  <button id="bNext" class="gold">NEXT QUESTION ▶</button>
</div>
<div id="toast"></div>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
